# PetFeeder — orquestração (container único: backend Node.js + SQLite + frontend)
#
# Uso:
#   1) cp .env.example .env  e defina JWT_SECRET / JWT_REFRESH_SECRET
#   2) docker compose up -d --build
#   3) acesse http://localhost:8080  (ou a HTTP_PORT que definir)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petfeeder
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/petfeeder.db
      # Obrigatórios: o compose falha se não estiverem no .env (sem defaults inseguros)
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no arquivo .env}
      # Allowlist de CORS (vazio = apenas mesma origem)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${HTTP_PORT:-8080}:3000"
    volumes:
      - petfeeder_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  petfeeder_data:
    name: petfeeder-data
